<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyBuddy — Choose a Version</title>
  <link rel="stylesheet" href="gate/style.css">
</head>
<body>

<main class="gate-wrap">

  <div id="passcodeScreen" class="gate-screen">
    <p class="gate-eyebrow">MoneyBuddy Prototype</p>
    <h1 class="gate-title">Enter passcode</h1>
    <input id="gateInput" class="gate-input" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <p id="gateError" class="gate-error" style="display:none;">Wrong passcode — try again.</p>
    <button type="button" class="gate-btn gate-btn-primary" onclick="gateSubmit()">Enter</button>
  </div>

  <div id="selectorScreen" class="gate-screen" style="display:none;">
    <p class="gate-eyebrow">MoneyBuddy Prototype</p>
    <h1 class="gate-title">Choose what to open</h1>
    <div id="gateTabs" class="gate-tabs" aria-label="Choose what to open" hidden>
      <button type="button" id="gateTabPrototype" class="gate-tab" aria-controls="gatePanelPrototype">Prototype</button>
      <button type="button" id="gateTabFlows" class="gate-tab" aria-controls="gatePanelFlows">Flows</button>
    </div>

    <section id="gatePanelPrototype" class="gate-panel" aria-labelledby="gateTabPrototype">
      <p class="gate-helper">The full MoneyBuddy app.</p>
      <!-- CATALOG -->
      <!-- LOCAL PREVIEW START -->
      <div id="localPreview" class="gate-stack">
        <a class="gate-btn gate-btn-primary" href="app/index.html">Local Prototype</a>
        <a class="gate-btn" href="https://mb-prototype-lab.github.io/public-prototype/" target="_blank" rel="noopener">Historical versions <span aria-hidden="true">↗</span><span class="gate-sr-only"> (opens in a new tab)</span></a>
      </div>
      <!-- Moved under the Flows list when the comparison is of a Flow (gate/local-variants.js). -->
      <section id="localVariants" class="local-variants" hidden aria-labelledby="localVariantsTitle">
        <h2 id="localVariantsTitle">Prototype variants</h2>
        <div id="localVariantsList" class="gate-list"></div>
        <button type="button" id="localCompare" class="gate-btn">Compare side by side</button>
      </section>
      <!-- LOCAL PREVIEW END -->
    </section>

    <section id="gatePanelFlows" class="gate-panel" aria-labelledby="gateTabFlows" hidden>
      <p class="gate-helper">Short journeys focused on one task.</p>
      <!-- FLOW CATALOG -->
      <!-- LOCAL PREVIEW START -->
      <div id="localFlows" hidden>
        <div id="localFlowsList" class="gate-list"></div>
      </div>
      <div id="localFlowVariantsSlot"></div>
      <!-- LOCAL PREVIEW END -->
    </section>
  </div>

</main>

<!-- LOCAL SCRIPTS START -->
<link rel="stylesheet" href="gate/local-compare.css">
<script src=".local-preview/variants.js"></script>
<script src=".local-preview/return.js"></script>
<script src="gate/local-variants.js"></script>
<script src="flows/catalog.js"></script>
<script src="gate/flows.js"></script>
<!-- LOCAL SCRIPTS END -->
<script src="gate/gate.js"></script>
</body>
</html>
