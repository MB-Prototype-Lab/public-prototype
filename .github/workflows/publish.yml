name: Publish snapshots
on:
  push:
    tags: ['publish/**']
permissions:
  contents: read
# Covers validation through deployment: a later run always sees the preceding manifest.
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - name: Validate and build in the shared image against the live manifest
        env:
          PUBLICATION_REF: ${{ github.ref }}
          MB_CHECK_RUN_ID: publication
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main --tags
          export MB_FETCHED_MAIN="$(git rev-parse refs/remotes/origin/main)"
          bash scripts/checks.sh ci-deploy
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .container-checks/reports/publication/publication-output
      - name: Reject a stale queued publication immediately before deployment
        run: |
          git fetch origin main --no-tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/deploy-pages@v4
        id: deployment
