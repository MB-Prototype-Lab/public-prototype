name: Checks
on:
  pull_request:
    branches: [main]
    # Journey declarations are read from the PR description.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: App and commit-series checks in the shared image
        run: bash scripts/checks.sh ci-app
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-comparison
          path: .container-checks/reports/
          if-no-files-found: ignore
          retention-days: 14
  publication:
    name: Publication checks
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publication checks in the shared image
        run: bash scripts/checks.sh ci-publication
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-checks
          path: .container-checks/reports/
          if-no-files-found: ignore
          retention-days: 14
  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Chromium comparisons, Flow checks and snapshot rehearsal
        run: bash scripts/checks.sh ci-browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-pictures
          path: .container-checks/reports/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
  powershell:
    name: PowerShell launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Native PowerShell 5.1 argument and inventory contracts
        shell: powershell
        run: .\tests\checks-powershell.ps1
