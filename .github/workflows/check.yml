name: Checks
on:
  pull_request:
    branches: [main]
    # `edited`: the journey check reads the PR description, so editing it re-runs.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/check-syntax.sh
      - run: bash scripts/sweep.sh
      - run: python3 scripts/check-paths.py
      - run: node tests/release-runtime.cjs
      - run: node tests/local-variants.cjs
      - run: node tests/flows-selector.cjs
      - run: node tests/gate-tabs.cjs
      - run: node tests/flows-runtime.cjs
      - run: python3 scripts/flows.py check
      - name: Flow script syntax
        run: bash scripts/check-syntax.sh flows
      - run: node tests/app-journeys.cjs --selftest
      - run: node tests/app-journeys.cjs
      - name: Journeys compared with the PR base, commit by commit
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node tests/app-journeys.cjs --justify --base "$BASE" --out "$RUNNER_TEMP/journeys"
          node tests/app-journeys.cjs --series "$BASE..$HEAD_SHA" --report --out "$RUNNER_TEMP/journeys"
      - name: Journeys compared with the previous main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: node tests/app-journeys.cjs --against "$BEFORE" --report --out "$RUNNER_TEMP/journeys"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-comparison
          path: ${{ runner.temp }}/journeys
          if-no-files-found: ignore
          retention-days: 14
  publication:
    name: Publication checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Catalog policy
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/publish.py check --base "$BASE"
      - name: Rehearse packaging without creating tags
        run: python3 scripts/publish.py build --offline --output "$RUNNER_TEMP/rehearsal"
  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    env:
      MB_PLAYWRIGHT_MODULE: ${{ github.workspace }}/tests/browser/node_modules/playwright
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: tests/browser
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - name: Browser journeys compared with the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          node tests/browser/app-journeys-browser.cjs --base "$RUNNER_TEMP/base" --head . --out "$RUNNER_TEMP/browser" --allow-declared
      # --report: changed pictures were declared by the merged PR, so they are
      # reported, not failed; a journey that breaks or a new page error still fails.
      - name: Browser journeys compared with the previous main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BEFORE"
          node tests/browser/app-journeys-browser.cjs --base "$RUNNER_TEMP/base" --head . --out "$RUNNER_TEMP/browser" --report
      # Run even after a failed picture comparison, so one run reports every
      # browser check.
      - name: Flow browser tests (file and HTTP)
        if: success() || failure()
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null 2>&1 && break
            sleep 0.2
          done
          MB_FLOW_BASE_URL=http://127.0.0.1:8765/ node tests/flows-browser.cjs
      - name: Flow snapshot rehearsal
        if: success() || failure()
        run: bash tests/browser/snapshot-smoke.sh "$RUNNER_TEMP/snapshot-smoke"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journey-pictures
          path: ${{ runner.temp }}/browser
          if-no-files-found: ignore
          retention-days: 14
          # PNG pictures are compressed already; zipping them again only costs time.
          compression-level: 0
