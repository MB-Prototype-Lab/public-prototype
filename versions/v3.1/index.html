<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // On browser refresh, return to the version gate (chooser) with a fresh app.
    // Only fires for reloads — first navigation in from the gate and back/forward
    // are left alone. App state is in-memory, so the gate round-trip clears inputs.
    (function () {
      var t = "";
      try {
        var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
        t = nav ? nav.type : (performance.navigation && performance.navigation.type === 1 ? "reload" : "");
      } catch (e) {}
      if (t === "reload") location.replace("../../index.html");
    })();
  </script>
  <title>MoneyBuddy Prototype</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/keyboard.css">
</head>
<body>

<div class="page">

  <!-- Phone frame -->
  <main class="phone" aria-label="Phone frame">
    <div class="screen">
      <div id="topbarRoot"></div>
      <div id="screenRoot" class="screen-scroll"></div>
      <div id="navRoot"></div>
      <!-- The simulated keyboard paints here. Deliberately a SIBLING of
           screenRoot, not a child: render() reassigns screenRoot.innerHTML on
           every state change, and a keyboard rebuilt mid-keystroke would take
           the caret with it. See components/keyboard.js. -->
      <!-- Ask Buddy paints here. A SIBLING of screenRoot for the same reason
           the keyboard is one: the pill must not move when the keypad adds or
           removes its 250px, or the press lands on nothing. One z-index below
           the keypad -- when both are up, the field being typed into wins. -->
      <div id="buddyRoot"></div>
      <div id="keyboardRoot"></div>
    </div>
  </main>

  <!-- Admin panel -->
  <aside class="admin" aria-label="Admin Tools">
    <div class="admin-header">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <p class="admin-title" style="margin:0;">Admin Tools</p>
        <button class="admin-collapse-btn" type="button" onclick="state.adminCollapsed=true;render()" title="Collapse admin">‹</button>
      </div>
      <p class="admin-subtitle" id="adminSubtitle">Manual controls for the active screen.</p>
      <button class="button secondary" style="margin-top:10px;width:100%;font-size:11px;" onclick="resetUserData()">Reset User Data</button>
      <!-- Theme picker (L21). Filled by render(); the four options live in
           THEMES (js/theme.js), not here. -->
      <p style="margin:10px 0 4px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--chrome-muted);">Theme</p>
      <div id="themePicker" style="display:grid;grid-template-columns:1fr 1fr;gap:4px;"></div>
      <button class="button secondary" style="margin-top:6px;width:100%;font-size:11px;" onclick="copyAppState()">Copy State</button>
    </div>
    <div id="adminRoot" class="admin-scroll"></div>
    <div id="adminFooter" style="padding:10px 14px;border-top:1px solid var(--chrome-line);font-size:10px;color:var(--chrome-muted);flex-shrink:0;">
      <div id="adminNavLog" style="margin-bottom:4px;"></div>
      <div id="adminErrorLog"></div>
    </div>
  </aside>

</div>

<!-- Admin expand tab — visible only when admin is collapsed -->
<button id="adminExpandTab" class="admin-expand-tab" type="button" onclick="state.adminCollapsed=false;render()" title="Expand admin">›</button>

<!-- 0. Developer tooling: error catcher + nav log updater -->
<script>
window.__lastError = null;
window.__navLog = [];
window.onerror = function(msg, src, line, col) {
  window.__lastError = { msg: String(msg), src: String(src).split('/').pop(), line: line, col: col, screen: (typeof state !== 'undefined') ? state.screen : '?' };
  var el = document.getElementById('adminErrorLog');
  if (el) el.innerHTML = '<span style="color:var(--chrome-danger)">⚠ ' + window.__lastError.screen + ' · ' + window.__lastError.src + ':' + line + ' · ' + String(msg).slice(0,80) + '</span>';
};
window.onunhandledrejection = function(e) {
  window.__lastError = { msg: String(e.reason), screen: (typeof state !== 'undefined') ? state.screen : '?' };
  var el = document.getElementById('adminErrorLog');
  if (el) el.innerHTML = '<span style="color:var(--chrome-danger)">⚠ unhandled · ' + window.__lastError.screen + ' · ' + String(e.reason).slice(0,80) + '</span>';
};
</script>
